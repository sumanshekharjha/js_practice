<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
   body {
    margin: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}


.calc {
    border: 1px solid black;
    width: 300px;
    padding: 15px;
    border-radius: 10px;
    background: linear-gradient(45deg, #0d0d0d, #3a4452);
}


input {
    width: 90%;
    border: none;
    padding: 20px;
    background: transparent;
    font-size: 24px;
    text-align: right;
    color: white;
    outline: none;
}

input::placeholder {
    font-size: 28px;
    font-weight: 600;
    color: #aaa;
}


.button {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
}


button {
    flex: 1; 
    margin: 5px;
    padding: 15px 0;
    font-size: 18px;
    color:white;
    border: black 1px solid;
    border-radius: 8px;
    box-shadow:5px 5px 10px #3a4452;
    background:transparent;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #ddd;
}

.button:last-child button:first-child {
    flex: 2;
}
</style>
<body>
    <div class="calc">

       <input type="text" placeholder="0" id="inputbox"/>
       <div class="button">
       <button class="operator">AC</button>
       <button class="operator">DEL</button>
       <button class="operator">%</button>
       <button class="operator">/</button>
       </div>
        <div class="button">
       <button>9</button>
       <button>8</button>
       <button>7</button>
       <button class="operator">*</button>
       </div>
        <div class="button">
       <button>6</button>
       <button>5</button>
       <button>4</button>
       <button class="operator">+</button>
       </div>
        <div class="button">
       <button>3</button>
       <button>2</button>
       <button>1</button>
       <button class="operator">-</button>
       </div>
        <div class="button">
       <button>00</button>
       <button>0</button>
       <button>.</button>
       <button>=</button>
       </div>
    </div>
</body>
<script>
let input = document.getElementById('inputbox');
let buttons = document.querySelectopgyrAll('button');

 let string= "";
 let arr = Array.from(buttons);
 arr.forEach(button =>{
    button.addEventListener('click',(e)=>{
        if(e.target.innerHTML == '='){
            string = eval(string);
            input.value = string;
        }else if(e.target.innerHTML == 'AC'){
            string = "";
            input.value = string;
        }else if(e.target.innerHTML == 'DEL'){
             string = string.substring(0 , string.length-1);
             input.value = string; 
        }
        else{
        string += e.target.innerHTML;
        input.value = string;
        }
    })
 })

    </script>
</html>
