<!-- Password generator JS-->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
 </head>
 <style>
    body {
    margin: 20px;
    display: flex;
    justify-content: center;
    align-items: center;
    height:100vh;
     background: linear-gradient(345deg, #144454, #dec57868);
     color:whitesmoke;
      font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    }
    
 .card{
    border: 1px solid rgb(174, 165, 165);
    width: 350px;
    height: 50vh;
    padding: 15px;
    border-radius: 10px;
    /* background: linear-gradient(45deg, #3eb7e0, #7494c168);
     */
     background:transparent;
     box-shadow: 10px 10px 10px 10px gray;
}
.content{
    display:flex;
    flex-direction: column;
}
.content h1{
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    color: aliceblue;
}
input{
    height:2rem;
    background-color: whitesmoke;
    color: rgb(26, 22, 18);

}
.row{
    display:flex;
    margin-block :4px;
}
.row p{
    flex-basis:100%;
    margin-top:auto;
}
.check{
    font-size:medium;
    display: flex;
    align-items: center;   
    justify-content: space-between; 
}
.genBtn{
    border:none;
    outline:none;
    background-color:#2c619e;
    padding:12px 24px;
    color:beige;
    font-size: medium;
}
#copyBtn{
    margin-top:5px;
    border:none;
    outline:none;
    width: 50px;
    margin-left:140px;
}
 </style>
 <body>
    <div class="card">
     <div class="content">
        <h1>Password Generator</h1>
       <input type="text"  id="passbox">
       <button id="copyBtn">Copy</button>

       <input type="range" min="5" max="20" value="8" id="inputslider">
       <div class="row">
         <p>Password Length</p>
        <span id="slidervalue"></span>
    </div>
    <div class="check">
        <label>Include lowercase char(a-z)</label>
        <input type="checkbox" name="lowercase" id="lowercase">
    </div>
       <div class="check">
        <label>Include uppercase char(A-Z)</label>
        <input type="checkbox" name="uppercase" id="uppercase">
    </div>
    <div class="check">
        <label>Include numbers (0-9)</label>
        <input type="checkbox" name="numbers" id="numbers">
    </div>
    <div class="check">
        <label>Include symbols</label>
        <input type="checkbox" name="symbols" id="symbols">
    </div>
   <button class="genBtn" id="genBtn">Generate password</button>
    </div>
    </div>
 </body>
<script>
    let inputSlider = document.getElementById("inputslider");
let sliderValue = document.getElementById("slidervalue");
let passBox = document.getElementById("passbox");
let lowercase = document.getElementById("lowercase");
let uppercase = document.getElementById("uppercase");
let number = document.getElementById("numbers");
let symbol = document.getElementById("symbols");
let genBtn = document.getElementById("genBtn");
let copyBtn = document.getElementById("copyBtn");

inputSlider.addEventListener('input', () => {
    sliderValue.textContent = inputSlider.value;
});

genBtn.addEventListener('click', () => {
    passBox.value = generatePassword();
});

let upperChar = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
let lowerChar = "abcdefghijklmnopqrstuvwxyz";
let numberChar = "0123456789";
let symbolChar = "!@#$%^&*_?";

// Function
function generatePassword() {
    let genPass = "";
     let allChar="";
     allChar += lowercase.checked ? lowerChar : "";  //checked is for checkbox
     allChar += uppercase.checked ? upperChar : "";
     allChar += number.checked ? numberChar : "";
     allChar += symbol.checked ? symbolChar : "";
 
     if(allChar == "" || allChar.length == 0){
        return genPass;
     }
      for(let i=1;i<=inputSlider.value;i++){
    genPass += allChar.charAt(Math.floor(Math.random() * allChar.length));
      }
    return genPass;
}
copyBtn.addEventListener('click', () => {
    if( passBox.value.length > 1 ){
      navigator.clipboard.writeText(passBox.value);
      
      copyBtn.innerText = "copied";
      setTimeout(() =>{
        copyBtn.innerText = "Copy";
      },3000);
    }
})
</script>
  
 


 </html>
