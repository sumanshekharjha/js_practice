<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
    * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

      body {
            background: #1f1f1f;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
      .card {
            width: 380px;
            background: linear-gradient(135deg, #5fd0a5, #5b7fff);
            color: #fff;
            border-radius: 22px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: 0.3s;
        }

    

    .search {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search input {
            flex: 1;
            border: none;
            outline: none;
            background: #ebfffc;
            color: #555;
            padding: 10px 15px;
            height: 40px;
            border-radius: 30px;
            font-size: 14px;
        }

        .search button {
            border: none;
            outline: none;
            background: #ebfffc;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 16px;
        }

        .weather-icon {
            width: 100px;
            margin-top: 10px;
        }

      .temp {
            font-size: 52px;
            font-weight: 500;
            margin-top: 10px;
        }

      .city {
            font-size: 26px;
            font-weight: 400;
            margin-top: 5px;
        }

     .details {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

     .col {
            display: flex;
            align-items: center;
            text-align: left;
            gap: 10px;
        }

        .col img {
            width: 30px;
        }

        .humidity,
        .wind {
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="card">

      <div class="search">
            <input type="text" placeholder="Enter city name" spellcheck="false">
            <button>🔍</button>
     </div>

     <div class="weather">
       <img src="https://cdn-icons-png.flaticon.com/512/1163/1163661.png" class="weather-icon">

      <h1 class="temp">22°C</h1>
           <h2 class="city">New York</h2>
     <div class="details">

        <div class="col">
             <img src="https://cdn-icons-png.flaticon.com/512/728/728093.png">
             <div>
                   <p class="humidity">50%</p>
                   <p>Humidity</p>
            </div>
        </div>

         <div class="col">
             <img src="https://cdn-icons-png.flaticon.com/512/1146/1146869.png">
             <div>
                <p class="wind">15 km/h</p>
                <p>Wind Speed</p>
            </div>
         </div>

    </div>

 </div>

    </div>

</body>
<script>
    const apiKey = "9d3de67ffa0c3add018f869e354302da";
const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q= ";

const searchBox = document.querySelector(".search input");
const searchBtn = document.querySelector(".search button");


async function checkWeather(city){
    const response = await fetch(apiUrl +city+ `&appid=${apiKey}`);
    var data = await response.json();

    console.log(data);
    document.querySelector(".city").innerHTML = data.name;
    document.querySelector(".temp").innerHTML = data.main.temp + "°C";
    document.querySelector(".humidity").innerHTML = data.main.humidity + "%" ;
    document.querySelector(".wind").innerHTML = data.wind.speed + "km/h";
}
searchBtn.addEventListener("click", () =>{
    checkWeather(searchBox.value);
}
 )


</script>
</html>
